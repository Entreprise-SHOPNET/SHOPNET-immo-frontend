

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Accès Admin | SHOPNET IMMO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-card {
      background: white;
      max-width: 480px;
      width: 100%;
      border-radius: 32px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .admin-header {
      background: #0f172a;
      padding: 32px 28px;
      text-align: center;
      color: white;
    }

    .admin-header i {
      font-size: 3rem;
      background: #FF5A5F;
      padding: 16px;
      border-radius: 60px;
      margin-bottom: 16px;
      display: inline-block;
    }

    .admin-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .admin-header p {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 8px;
    }

    .admin-body {
      padding: 32px 28px 40px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1e293b;
      font-size: 0.9rem;
    }

    .input-group i {
      margin-right: 8px;
      color: #FF5A5F;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 60px;
      transition: all 0.2s;
      background: #fefcfb;
      font-family: monospace;
    }

    .input-group input:focus {
      outline: none;
      border-color: #FF5A5F;
      box-shadow: 0 0 0 3px rgba(255, 90, 95, 0.2);
      background: white;
    }

    .login-btn {
      background: #FF5A5F;
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn:hover {
      background: #e14b50;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .error-message {
      background: #fee2e2;
      border-left: 5px solid #e11d48;
      padding: 14px 18px;
      border-radius: 60px;
      margin-bottom: 24px;
      color: #b91c1c;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .info-note {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 24px;
      border-top: 1px solid #eef2f6;
      padding-top: 20px;
    }

    .info-note i {
      margin-right: 5px;
    }
  </style>
</head>
<body>
<div class="admin-card">
  <div class="admin-header">
    <i>🔐</i>
    <h1>SHOPNET IMMO</h1>
    <p>Accès administrateur sécurisé</p>
  </div>
  <div class="admin-body">
    <div id="errorContainer"></div>
    <form id="adminLoginForm">
      <div class="input-group">
        <label><i class="fas fa-id-card"></i> Identifiant d'accès</label>
        <input type="text" id="adminId" placeholder="Identifiant" autocomplete="off" required>
      </div>
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Mot de passe</label>
        <input type="password" id="adminPassword" placeholder="Mot de passe" required>
      </div>
      <button type="submit" class="login-btn">
        <i class="fas fa-shield-alt"></i> Vérifier et accéder
      </button>
    </form>
    <div class="info-note">
      <i class="fas fa-fingerprint"></i> Accès restreint – Réservé à l'administration SHOPNET
    </div>
  </div>
</div>

<script>
  const VALID_ID = "admin_shopnet_01";
  const VALID_PASSWORD = "SHP@2026#ImmoSecure";

  const form = document.getElementById('adminLoginForm');
  const errorContainer = document.getElementById('errorContainer');

  function showErrorAndRedirect(message) {
    errorContainer.innerHTML = `
      <div class="error-message">
        <i class="fas fa-exclamation-triangle"></i> 
        ${message}
      </div>
    `;
    const submitBtn = form.querySelector('button');
    if (submitBtn) submitBtn.disabled = true;

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2000);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const enteredId = document.getElementById('adminId').value;
    const enteredPassword = document.getElementById('adminPassword').value;

    if (enteredId === VALID_ID && enteredPassword === VALID_PASSWORD) {
      window.location.href = 'ValideBien.html';
    } else {
      showErrorAndRedirect('❌ Identifiant ou mot de passe incorrect. Accès refusé.');
    }
  });
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
