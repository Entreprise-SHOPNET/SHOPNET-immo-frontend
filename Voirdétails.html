


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>SHOPNET IMMO – Détails du bien</title>
  <link rel="stylesheet" href="Voirdétails.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="detail-container">
    <!-- Barre retour simple -->
    <div class="top-bar">
      <a href="dashboard-commissionnaire.html" class="back-btn"><i class="fas fa-arrow-left"></i> Retour</a>
    </div>

    <!-- Titre -->
    <div class="hero-text">
      <h1 id="propertyTitle">Chargement...</h1>
    </div>

    <!-- Grille des informations détaillées -->
    <div class="info-grid" id="infoGrid">
      <div class="loader">Chargement des infos...</div>
    </div>

    <!-- Galerie photos -->
    <div id="galleryBlock" style="display: none;">
      <h3><i class="fas fa-images"></i> Photos du bien</h3>
      <div class="images-gallery" id="imagesGallery"></div>
    </div>
  </div>

  <!-- Lightbox pour agrandir les photos -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Agrandissement">
  </div>

  <script src="Voirdétails.js"></script>
</body>
</html>
