

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connexion | SHOPNET-IMMO</title>

  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

  <div class="container">
    <div class="login-card">

      <!-- BRAND -->
      <div class="brand">
        <h1>SHOPNET<span>-IMMO</span></h1>
        <p>Commissionnaires vérifiés</p>
      </div>

      <!-- FORM -->
      <form id="loginForm">

        <!-- LOGIN -->
        <div class="form-group">
          <label>
            <i class="fas fa-user"></i> Téléphone ou Email *
          </label>

          <input 
            type="text"
            id="telephone"
            name="login"
            placeholder="Ex: 0978727791 ou email@gmail.com"
            autocomplete="username"
          >

          <div class="error-message" id="error_telephone"></div>
        </div>

        <!-- PASSWORD WITH EYE -->
        <div class="form-group">
          <label>
            <i class="fas fa-lock"></i> Mot de passe *
          </label>

          <div class="password-wrapper">
            <input 
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
            >

            <span class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </span>
          </div>

          <div class="error-message" id="error_password"></div>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="forgot-password">
          <a href="/forgot-password.html">
            Mot de passe oublié ?
          </a>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn-login">
          Se connecter
        </button>

        <!-- REGISTER -->
        <div class="register-link">
          <a href="#">
            🔗 Pas encore inscrit ? Créer un compte commissionnaire
          </a>
        </div>

      </form>

      <!-- MESSAGE BOX -->
      <div id="messageBox" class="message-box"></div>

    </div>
  </div>

  <script src="login.js"></script>

  <!-- 🔥 TOGGLE PASSWORD SCRIPT -->
  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      const icon = document.getElementById("eyeIcon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>

</body>
</html>
