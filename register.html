


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Inscription commissionnaire | SHOPNET-IMMOLIER</title>
  <link rel="stylesheet" href="register.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="brand-sticky">
      <div class="brand">
        <h1>SHOPNET<span>-IMMOLIER</span></h1>
        <p>Devenez commissionnaire vérifié</p>
      </div>
    </div>

    <div class="form-card">
      <!-- Indicateur 3 étapes -->
      <div class="step-indicator">
        <div class="step active" data-step="1">1. Identité</div>
        <div class="step" data-step="2">2. Coordonnées</div>
        <div class="step" data-step="3">3. Justificatifs</div>
      </div>

      <!-- ÉTAPE 1 : Identité -->
      <form id="step1Form">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Nom complet *</label>
          <input type="text" id="nom_complet" name="nom_complet">
          <div class="error-message" id="error_nom"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-venus-mars"></i> Sexe *</label>
          <select id="sexe" name="sexe">
            <option value="">Sélectionnez</option>
            <option value="Homme">Homme</option>
            <option value="Femme">Femme</option>
          </select>
          <div class="error-message" id="error_sexe"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-calendar-alt"></i> Date de naissance * (≥ 18 ans)</label>
          <input type="date" id="date_naissance" name="date_naissance">
          <div class="error-message" id="error_date"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-id-card"></i> Numéro de carte d'électeur *</label>
          <input type="text" id="numero_carte" name="numero_carte">
          <div class="error-message" id="error_numero_carte"></div>
        </div>

        <div class="button-group">
          <button type="button" id="nextStep1" class="btn-next">Suivant <i class="fas fa-arrow-right"></i></button>
        </div>
      </form>

      <!-- ÉTAPE 2 : Coordonnées & Adresse -->
      <form id="step2Form" style="display: none;">
        <div class="form-group">
          <label><i class="fas fa-phone"></i> Téléphone *</label>
          <input type="tel" id="telephone" name="telephone" placeholder="0978727791">
          <div class="error-message" id="error_telephone"></div>
        </div>

        <div class="form-group">
          <label><i class="fab fa-whatsapp"></i> WhatsApp (optionnel)</label>
          <input type="tel" id="whatsapp" name="whatsapp" placeholder="0978727791">
          <div class="error-message" id="error_whatsapp"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email *</label>
          <input type="email" id="email" name="email">
          <div class="error-message" id="error_email"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-lock"></i> Mot de passe *</label>
          <input type="password" id="password" name="password">
          <div class="error-message" id="error_password"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-building"></i> Agence (optionnel)</label>
          <input type="text" id="agence" name="agence">
        </div>

        <div class="form-group">
          <label><i class="fas fa-city"></i> Ville *</label>
          <input type="text" id="ville" name="ville">
          <div class="error-message" id="error_ville"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-map-marker-alt"></i> Commune *</label>
          <input type="text" id="commune" name="commune">
          <div class="error-message" id="error_commune"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-road"></i> Quartier *</label>
          <input type="text" id="quartier" name="quartier">
          <div class="error-message" id="error_quartier"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-street-view"></i> Avenue *</label>
          <input type="text" id="avenue" name="avenue">
          <div class="error-message" id="error_avenue"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-home"></i> Numéro maison *</label>
          <input type="text" id="numero_maison" name="numero_maison">
          <div class="error-message" id="error_numero_maison"></div>
        </div>

        <div class="button-group double">
          <button type="button" id="prevStep2" class="btn-prev"><i class="fas fa-arrow-left"></i> Retour</button>
          <button type="button" id="nextStep2" class="btn-next">Suivant <i class="fas fa-arrow-right"></i></button>
        </div>
      </form>

      <!-- ÉTAPE 3 : Justificatifs & Profession -->
      <form id="step3Form" style="display: none;">
        <div class="form-group">
          <label><i class="fas fa-chart-line"></i> Spécialisation *</label>
          <input type="text" id="specialisation" name="specialisation" placeholder="Ex: Résidentiel, Commercial, Terrain">
          <div class="error-message" id="error_specialisation"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-map-marked-alt"></i> Zone d'activité *</label>
          <input type="text" id="zone_activite" name="zone_activite" placeholder="Lubumbashi, Kinshasa, ...">
          <div class="error-message" id="error_zone_activite"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-briefcase"></i> Expérience (années) *</label>
          <input type="number" id="experience" name="experience" min="0" step="1">
          <div class="error-message" id="error_experience"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-id-card"></i> Carte électeur (Recto) *</label>
          <div class="file-zone" data-target="carte_recto">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Cliquez ou glissez le recto</p>
            <span>JPEG, PNG (max 5Mo)</span>
            <input type="file" id="carte_recto" name="carte_recto" accept="image/jpeg,image/png,image/jpg">
          </div>
          <div class="file-preview" id="preview_recto"></div>
          <div class="error-message" id="error_recto"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-id-card"></i> Carte électeur (Verso) *</label>
          <div class="file-zone" data-target="carte_verso">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Cliquez ou glissez le verso</p>
            <span>JPEG, PNG (max 5Mo)</span>
            <input type="file" id="carte_verso" name="carte_verso" accept="image/jpeg,image/png,image/jpg">
          </div>
          <div class="file-preview" id="preview_verso"></div>
          <div class="error-message" id="error_verso"></div>
        </div>

        <div class="form-group">
          <label><i class="fas fa-camera"></i> Photo de profil (optionnelle)</label>
          <div class="file-zone" data-target="photo_profil">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Cliquez ou glissez votre photo</p>
            <span>JPEG, PNG (max 5Mo)</span>
            <input type="file" id="photo_profil" name="photo_profil" accept="image/jpeg,image/png,image/jpg">
          </div>
          <div class="file-preview" id="preview_photo"></div>
          <div class="error-message" id="error_photo"></div>
        </div>

        <div class="button-group double">
          <button type="button" id="prevStep3" class="btn-prev"><i class="fas fa-arrow-left"></i> Retour</button>
          <button type="submit" id="submitBtn" class="btn-submit">✅ Créer mon compte</button>
        </div>
      </form>

      <div id="messageBox" class="message-box"></div>
      <div class="login-link">
        <a href="Login.html">🔗 J’ai déjà un compte ? Se connecter</a>
      </div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
